<style>


:root,
[data-theme="light"]{
  --bg:#F5F2EB; --surface:#FAF8F4; --surface-2:#EFEBE3;
  --ink:#3E2C1F; --muted:#7D6B5D;
  --wood:#8B5E3C; --wood-light:#B88A6A;
  --sage:#4A5D4E; --sage-light:#7A907E;
  --gold:#D4A373; --gold-light:#E8C9A6;
  --danger:#C26B5A; --success:#5A8F7B;
  --nav-bg: rgba(245,242,235,.85);
  --border-soft: rgba(255,255,255,.6);
  --shadow-clay: 8px 8px 16px rgba(160,140,120,.25), -8px -8px 16px rgba(255,255,255,.8);
  --shadow-clay-sm: 4px 4px 8px rgba(160,140,120,.2), -4px -4px 8px rgba(255,255,255,.7);
  --shadow-clay-inset: inset 3px 3px 8px rgba(160,140,120,.15), inset -3px -3px 8px rgba(255,255,255,.6);
  color-scheme: light;
}


[data-theme="dark"]{
  --bg:#1E1A16; --surface:#26211C; --surface-2:#2E2822;
  --ink:#F2EAD9; --muted:#B5A692;
  --wood:#B88A6A; --wood-light:#D4A373;
  --sage:#7A907E; --sage-light:#A6B8AA;
  --gold:#E8C9A6; --gold-light:#F0D9B8;
  --danger:#E08C7B; --success:#7BBFA4;
  --nav-bg: rgba(30,26,22,.85);
  --border-soft: rgba(255,255,255,.06);
  --shadow-clay: 8px 8px 16px rgba(0,0,0,.45), -8px -8px 16px rgba(255,255,255,.04);
  --shadow-clay-sm: 4px 4px 8px rgba(0,0,0,.4), -4px -4px 8px rgba(255,255,255,.05);
  --shadow-clay-inset: inset 3px 3px 8px rgba(0,0,0,.4), inset -3px -3px 8px rgba(255,255,255,.05);
  color-scheme: dark;
}


:root{
  --radius-sm:16px; --radius-md:24px; --radius-lg:32px;
  --g:clamp(16px,4vw,48px); --sec:clamp(70px,9vw,120px);
  --out:cubic-bezier(.16,1,.3,1);
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:88px;
  -webkit-text-size-adjust:100%;
  box-sizing:border-box;
  background:var(--bg);
  transition:background-color .35s var(--out);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
section[id],header[id]{scroll-margin-top:88px}

body{
  font-family:'Vazirmatn',system-ui,sans-serif;
  line-height:1.8;font-size:.95rem;color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,163,115,.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(74,93,78,.10) 0%, transparent 50%);
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:color .35s var(--out), background-color .35s var(--out);
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,163,115,.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(122,144,126,.10) 0%, transparent 50%);
}

a{color:inherit;text-decoration:none}
ul{list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
::selection{background:rgba(212,163,115,.5)}

.d{font-family:'Lalezar','Vazirmatn',sans-serif;font-weight:400;line-height:1.25}
.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1.d{font-size:clamp(2.7rem,8.6vw,6.8rem);max-width:11ch}
h2.d{font-size:clamp(1.9rem,5vw,3.6rem);max-width:17ch}
.lede{font-size:1.05rem;color:var(--muted);max-width:44ch;margin:24px 0 48px}

.skip{
  position:absolute;top:-40px;right:12px;background:var(--wood);color:#fff;
  padding:8px 16px;border-radius:0 0 12px 12px;z-index:200;font-weight:700;
}
.skip:focus{top:env(safe-area-inset-top,0px)}


.btn{
  display:inline-block;padding:12px 28px;border-radius:50px;
  background:var(--gold);color:var(--ink);
  font:800 .85rem 'Vazirmatn',sans-serif;
  border:none;cursor:pointer;
  box-shadow:var(--shadow-clay-sm);
  transition:transform .3s var(--out), box-shadow .3s, background .35s, color .35s;
}
.btn:hover{transform:translateY(-3px);box-shadow:10px 10px 20px rgba(160,140,120,.3), -10px -10px 20px rgba(255,255,255,.9)}
.btn.s{padding:8px 20px;font-size:.78rem;background:var(--surface);color:var(--wood);box-shadow:var(--shadow-clay-sm)}
.btn.s:hover{transform:translateY(-2px);box-shadow:6px 6px 12px rgba(160,140,120,.25), -6px -6px 12px rgba(255,255,255,.8)}


.bar{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--wood));z-index:100;border-radius:3px;transition:width .1s linear}


.nav{
  position:fixed;top:0;inset-inline:0;z-index:90;
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) var(--g) 16px;
  border-bottom:1px solid transparent;
  transition:padding .35s var(--out),background .35s,border-color .35s;
}
.nav.sc{
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-bottom:8px;
  background:var(--nav-bg);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-color:rgba(160,140,120,.15);
}
.brand{display:flex;align-items:center;gap:10px;font-size:1.4rem;direction:ltr}
.brand i{font-style:normal;background:var(--gold);padding:0 6px;border-radius:6px;color:var(--ink)}
.mark{width:34px;height:34px;border-radius:12px;background:var(--wood);color:var(--gold-light);display:grid;place-items:center;box-shadow:var(--shadow-clay-sm)}
.mark svg{width:19px;height:19px}
.links{display:flex;gap:34px;font-size:.82rem;font-weight:600;color:var(--muted)}
.links a{transition:color .2s}
.links a:hover{color:var(--wood)}


.nav-actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  position:relative;
  width:64px;height:32px;border-radius:50px;border:none;cursor:pointer;
  background:var(--surface-2);
  box-shadow:var(--shadow-clay-inset);
  transition:background .35s;
  display:inline-flex;align-items:center;padding:0 4px;
}
.theme-toggle::before{
  content:"";
  position:absolute;top:4px;right:4px;
  width:24px;height:24px;border-radius:50%;
  background:var(--gold);
  box-shadow:var(--shadow-clay-sm);
  transition:transform .4s var(--out), background .35s;
  z-index:1;
}
[data-theme="dark"] .theme-toggle::before{
  transform:translateX(-32px);
  background:var(--wood);
}
.theme-toggle svg{position:relative;z-index:2;width:14px;height:14px;color:var(--muted);transition:color .3s}
.theme-toggle .sun{margin-right:5px;margin-left:auto}
.theme-toggle .moon{margin-left:5px;margin-right:auto}


.theme-mode{
  display:inline-flex;background:var(--surface-2);border-radius:50px;padding:3px;
  box-shadow:var(--shadow-clay-inset);gap:0;
}
.theme-mode button{
  border:none;background:transparent;cursor:pointer;
  padding:5px 10px;border-radius:50px;
  font:700 .7rem 'Vazirmatn',sans-serif;color:var(--muted);
  transition:background .3s,color .3s;
}
.theme-mode button[aria-pressed="true"]{
  background:var(--gold);color:var(--ink);
}


.jl{margin-top:20px}
.ji{display:grid;grid-template-columns:54px 1fr 30px;gap:26px;align-items:center;padding:32px 24px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-clay-sm);border:1px solid var(--border-soft);transition:transform .3s var(--out), box-shadow .3s, background .35s}

.cta{text-align:center;padding:var(--sec) var(--g);margin:var(--sec) var(--g) 0;background:var(--wood);border-radius:var(--radius-lg);box-shadow:var(--shadow-clay);color:#fff;transition:background .35s}

.ft{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px var(--g) calc(30px + env(safe-area-inset-bottom,0px));background:var(--surface-2);color:var(--muted);font-size:.75rem;margin-top:var(--sec);border-radius:var(--radius-md) var(--radius-md) 0 0;transition:background .35s}
.st{display:inline-flex;align-items:center;gap:8px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.4}}

.rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--out),transform .9s var(--out)}
.rv.vis{opacity:1;transform:none}

main{max-width:980px;margin:0 auto;padding:clamp(104px,13vw,140px) var(--g) 0;min-height:70vh}

.body{max-width:42em;font-size:1rem;line-height:2.05}

.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.next{display:block;margin-top:34px;color:var(--muted);font-size:.8rem}

.cta{margin-inline:0}

.ft a{color:var(--wood);font-weight:700}
@media(max-width:620px){.scs{grid-template-columns:1fr}.nav .btn.s{display:none}}

<script>
(()=>{'use strict';
const POSTS=[
{slug:'why-journal',cat:'ژورنال‌نویسی',date:'آبان ۱۴۰۵',min:4,title:'چرا بدون ژورنال، معامله‌گر نمی‌شوی؟',sum:'حافظه تو را گول می‌زند. ژورنال یگانه راه دیدن الگوهای واقعی خودت است.',
body:`<p>بیشتر معامله‌گرها فکر می‌کنند می‌دانند چطور معامله می‌کنند. وقتی آمار واقعی را می‌بینند، چیز دیگری درمی‌آید. حافظه سودهای بزرگ را پررنگ و ضررهای تکراری را کم‌رنگ نگه می‌دارد.</p>
<h3>ژورنال چه چیزهایی را نشان می‌دهد؟</h3>
<ul><li>کدام نماد، سشن و استراتژی واقعاً برایت سود می‌سازد و کدام فقط حس خوبی می‌دهد.</li><li>بیشترین ضررها بعد از چه حالتی می‌آید: انتقام، عجله، خستگی یا FOMO.</li><li>آیا به پلن خودت پایبندی یا فقط فکر می‌کنی پایبندی.</li></ul>
<div class="eg"><b>مثال:</b> معامله‌گری فکر می‌کرد طلا نمادِ قوی‌اش است. بعد از ثبت ۶۰ معامله دید ۷۰٪ ضررهایش در سشن آسیا و روی طلا است. حذف همان سشن، نتیجه‌ی ماهش را عوض کرد.</div>
<h3>چه چیزی ثبت کنیم؟</h3>
<p>کمتر از آنچه فکر می‌کنی: نماد، جهت، ورود، استاپ، خروج، حجم، ریسک درصدی، استراتژی و یک جمله درباره‌ی حالت ذهنی‌ات. ژورنالی که ثبتش سخت باشد، بعد از دو هفته رها می‌شود.</p>
<h3>چه زمانی مرور کنیم؟</h3>
<p>یک بار در هفته، ده دقیقه. به جای تماشای تک‌تک معاملات، سه سؤال بپرس: بهترین الگوی این هفته چه بود؟ تکراری‌ترین اشتباه کدام بود؟ هفته‌ی بعد فقط یک چیز را چطور عوض کنم؟</p>`},

{slug:'r-multiple',cat:'مدیریت ریسک',date:'آبان ۱۴۰۵',min:5,title:'R چیست و چرا از سود دلاری مهم‌تر است؟',sum:'سود ۲۰۰ دلاری روی حساب ۱۰۰۰ دلاری با سود ۲۰۰ دلاری روی حساب ۱۰٬۰۰۰ دلاری یکی نیست. R این را حل می‌کند.',
body:`<p>R واحدی است که سود و زیان را به‌جای دلار، بر حسب ریسک همان معامله می‌سنجد. اگر در یک معامله ۱۰۰ دلار ریسک کرده‌ای، آن ۱۰۰ دلار می‌شود «۱R».</p>
<div class="eg"><b>مثال:</b> ریسک <span class="num">$100</span>. سود <span class="num">$250</span> یعنی <span class="num">+2.5R</span>. ضرر کامل یعنی <span class="num">-1R</span>.</div>
<h3>چرا R بهتر از دلار است؟</h3>
<p>چون معاملات با ریسک‌های مختلف را قابل مقایسه می‌کند. معامله‌ای که با ریسک کم <span class="num">+3R</span> شده، از معامله‌ای که با ریسک زیاد <span class="num">+0.5R</span> شده بهتر اجرا شده؛ حتی اگر سود دلاری دومی بیشتر باشد.</p>
<h3>امید ریاضی (Expectancy)</h3>
<p>میانگین R هر معامله در بلندمدت. فرمولش ساده است:</p>
<div class="eg num" style="direction:ltr;text-align:left">Expectancy = (Win% × Avg Win R) − (Loss% × Avg Loss R)</div>
<p>اگر ۴۰٪ معاملات برنده با میانگین <span class="num">2R</span> و ۶۰٪ بازنده با میانگین <span class="num">1R</span> باشد: <span class="num">0.4×2 − 0.6×1 = +0.2R</span> برای هر معامله. با وین‌ریت ۴۰٪ هم می‌شود سودده بود.</p>
<p>در Tradyar، R هر معامله بر اساس ریسک درصدی ثبت‌شده‌ی همان معامله حساب می‌شود، نه یک عدد ثابت.</p>`},

{slug:'position-size',cat:'مدیریت ریسک',date:'آبان ۱۴۰۵',min:5,title:'حجم معامله را چطور حساب کنیم؟ فرمول و مثال',sum:'اول ریسک دلاری را مشخص کن، بعد از روی فاصله‌ی استاپ، حجم را درآور؛ نه برعکس.',
body:`<p>اشتباه رایج این است که اول لات انتخاب می‌شود و بعد استاپ جایی گذاشته می‌شود که «جا بشود». روش درست برعکس است: ریسک را ثابت کن و حجم را با فاصله‌ی استاپ تنظیم کن.</p>
<h3>سه مرحله</h3>
<ul><li>ریسک دلاری = موجودی × درصد ریسک</li><li>فاصله‌ی استاپ را به پیپ (یا پوینت) بنویس.</li><li>حجم = ریسک دلاری ÷ (فاصله‌ی استاپ × ارزش هر پیپ برای یک لات)</li></ul>
<div class="eg"><b>مثال EURUSD:</b> موجودی <span class="num">$10,000</span>، ریسک ۱٪ یعنی <span class="num">$100</span>. استاپ <span class="num">50</span> پیپ و ارزش هر پیپ برای یک لات <span class="num">$10</span> است.<br>حجم = <span class="num">100 ÷ (50 × 10) = 0.20</span> لات.</div>
<h3>جفت‌ارزهایی که دلار ندارند</h3>
<p>در جفت‌هایی مثل GBPJPY یا CADNZD سود به ارز دوم می‌آید و برای تبدیل به دلار نرخ آن ارز لازم است. برای همین ارزش پیپ با قیمت لحظه‌ای عوض می‌شود. Tradyar برای این جفت‌ها از تو نرخ تبدیل را می‌خواهد تا عدد دقیق شود.</p>
<p>یادآوری: اندازه‌ی قرارداد و ارزش پیپ در طلا، شاخص‌ها و کریپتو بین بروکرها فرق دارد؛ قبل از اتکا به هر محاسبه‌گر، یک بار با پلتفرم خودت مقایسه‌اش کن.</p>`},

{slug:'prop-drawdown',cat:'پراپ‌فرم',date:'آبان ۱۴۰۵',min:5,title:'دراودان در پراپ‌فرم: چرا بیشتر چالش‌ها همین‌جا می‌سوزند؟',sum:'ضرر روزانه، دراودان کل و تفاوت ثابت با تریلینگ: پیش از خرید چالش بخوان.',
body:`<p>بیشتر کسانی که چالش پراپ را می‌بازند، به‌خاطر استراتژی بد نمی‌بازند؛ به‌خاطر نقض یک قانون دراودان می‌بازند. قوانین هر شرکت فرق دارد و ممکن است عوض شود، پس همیشه متن رسمی همان شرکت را بخوان. اما مفهوم‌ها مشترک‌اند.</p>
<h3>سه قانونی که باید دقیق بدانی</h3>
<ul><li><b>حداکثر ضرر روزانه:</b> سقف زیانی که در یک روز مجازی. بپرس: بر اساس موجودی ابتدای روز حساب می‌شود یا اکوییتی (شامل معاملات باز)؟</li><li><b>حداکثر دراودان کل:</b> افت مجاز از سرمایه‌ی اولیه.</li><li><b>ثابت یا تریلینگ:</b> در حالت تریلینگ، سقف دراودان با بالا رفتن اکوییتی بالا می‌آید و حاشیه‌ی امنت کم می‌شود.</li></ul>
<h3>چرا ضررها سنگین‌تر از چیزی‌اند که فکر می‌کنی</h3>
<table><tr><th>ضرر</th><th>سود لازم برای جبران</th></tr><tr><td class="num">10%</td><td class="num">11.1%</td></tr><tr><td class="num">20%</td><td class="num">25%</td></tr><tr><td class="num">50%</td><td class="num">100%</td></tr></table>
<p>پس عملی‌ترین دفاع، ریسک کوچک‌تر از سقف‌هاست؛ مثلاً اگر ضرر روزانه‌ی مجاز ۵٪ است، سقف شخصی‌ات را ۲ تا ۳٪ بگذار تا یک روز بد حسابت را نبرد.</p>
<p>در Tradyar برای هر حساب می‌توانی قوانین پراپ را بنویسی و وقتی به ۵۰٪، ۷۵٪ و ۹۰٪ سقف رسیدی هشدار بگیری.</p>`},
{slug:'emotions',cat:'روان‌شناسی',date:'آبان ۱۴۰۵',min:4,title:'ترس و طمع را چطور در ژورنال ثبت کنیم؟',sum:'احساس را نمی‌شود حذف کرد، ولی می‌شود دید کجا و چند بار تصمیم‌هایت را عوض می‌کند.',
body:`<p>بیشتر اشتباه‌های معاملاتی از تحلیل بد نمی‌آیند؛ از لحظه‌ای می‌آیند که حالت ذهنی‌ات از پلن جلو می‌زند. چیزی که ثبت نشود، دیده نمی‌شود و چیزی که دیده نشود، تکرار می‌شود.</p>
<h3>سه حالت که ارزش ثبت دارند</h3>
<ul><li><b>ترس:</b> زود بستن معامله‌ی سالم، یا جابه‌جا نکردن استاپ به‌خاطر نگرانی.</li><li><b>طمع:</b> بزرگ کردن حجم بعد از چند برد، یا نبستن در تارگت.</li><li><b>انتقام:</b> معامله‌ی فوری بعد از ضرر برای جبران.</li></ul>
<h3>چطور ثبت کنیم؟</h3>
<p>بعد از هر معامله فقط یک برچسب بزن: چه حالتی داشتم و آیا طبق پلن بودم؟ بعد از ۲۰ تا ۳۰ معامله، آمار را مقایسه کن: میانگین R وقتی آرام بوده‌ای در برابر وقتی عجله داشته‌ای.</p>
<div class="eg"><b>نتیجه‌ی رایج:</b> معامله‌هایی که با «انتقام» ثبت می‌شوند معمولاً بدترین R را دارند. وقتی عدد جلوی چشمت باشد، تصمیم «امروز دیگر نه» راحت‌تر می‌شود.</div>
<p>در Tradyar برای هر معامله می‌توانی احساس، کیفیت اجرا و رعایت پلن را ثبت کنی و بعداً بر اساس آن‌ها آمار ببینی.</p>`}
];
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const fa=n=>Number(n).toLocaleString('fa'),root=document.documentElement,app=$('#app');
const WA='989021879076',IG='masoud_moradi_bm';

/* تم */
const KEY='tradyar:blog-theme',mq=matchMedia('(prefers-color-scheme: dark)');let mode='system';try{mode=localStorage.getItem(KEY)||'system'}catch(e){}
function applyTheme(m){const t=m==='system'?(mq.matches?'dark':'light'):m;root.setAttribute('data-theme',t);$$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===m));const mc=$('meta[name="theme-color"]');if(mc)mc.setAttribute('content',t==='dark'?'#1E1A16':'#F5F2EB')}
function setTheme(m){mode=m;try{localStorage.setItem(KEY,m)}catch(e){}applyTheme(m)}
applyTheme(mode);
$$('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));
$('#themeToggle').addEventListener('click',()=>setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
mq.addEventListener('change',()=>{if(mode==='system')applyTheme('system')});
/* بخش‌های مشترک */
const supportHTML=`<section class="sup rv" id="support"><h2 class="d">پشتیبانی</h2><p>سؤال، مشکل پرداخت یا پیشنهاد داری؟ مستقیم پیام بده؛ معمولاً همان روز جواب می‌دهیم.</p><div class="scs"><a class="sbtn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${ICON_WA}<div><b>واتساپ</b><small class="n">+98 902 187 9076</small></div></a><a class="sbtn ig" href="https://instagram.com/${IG}" target="_blank" rel="noopener">${ICON_IG}<div><b>اینستاگرام</b><small class="n">@${IG}</small></div></a></div></section>`;
const ctaHTML=`<section class="cta rv"><h2 class="d">اولین معامله‌ات را همین حالا ثبت کن</h2><p>ده ثانیه وقت می‌گیرد، هفت روز اول رایگان است و از همان روز ژورنالت از تو یاد می‌گیرد.</p><a href="./" class="btn">شروع رایگان</a></section>`;
let cat='همه';
const CATS=['همه',...new Set(POSTS.map(p=>p.cat))];
function listHTML(){return POSTS.map((p,i)=>({p,i})).filter(x=>cat==='همه'||x.p.cat===cat).map(({p,i})=>`<a href="#/${p.slug}" class="ji rv"><span class="jnum">${fa(i+1)}</span><div><small>${p.cat}</small><h3>${p.title}</h3><p>${p.sum}</p><div class="mt"><span>${p.date}</span><span>${fa(p.min)} دقیقه مطالعه</span></div></div>${ARROW}</a>`).join('')}
function home(){
  document.title='وبلاگ Tradyar | آموزش ژورنال‌نویسی و مدیریت ریسک';
  app.innerHTML=`<header class="hero"><h1 class="d">از دنیای معامله‌گری</h1><p class="lede">مقاله‌های کوتاه و عملی درباره‌ی ژورنال، R، حجم معامله، روان‌شناسی و قوانین پراپ‌فرم.</p><div class="ch" role="group" aria-label="دسته‌بندی">${CATS.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div></header><div class="jl" id="jl">${listHTML()}</div>${ctaHTML}${supportHTML}`;
  $$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.cat;$$('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===cat));$('#jl').innerHTML=listHTML();reveal()}));
}
function post(i){
  const p=POSTS[i],n=POSTS[(i+1)%POSTS.length];
  document.title=p.title+' | Tradyar';
  app.innerHTML=`<article class="art"><a class="back" href="#/">→ همه‌ی مقاله‌ها</a><div class="meta"><small>${p.cat}</small><span>${p.date}</span><span>${fa(p.min)} دقیقه مطالعه</span><button id="cp" type="button">کپی لینک</button></div><h1 class="d">${p.title}</h1><div class="body">${p.body}</div><a class="next" href="#/${n.slug}">مقاله‌ی بعدی<b>${n.title}</b></a></article>${ctaHTML}${supportHTML}`;
  $('#cp').onclick=e=>{const b=e.target,old=b.textContent;(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>b.textContent='کپی شد',()=>b.textContent='لینک را از نوار آدرس بردار');setTimeout(()=>b.textContent=old,2200)};
}
let io;
function reveal(){if(!('IntersectionObserver' in window)){$$('.rv').forEach(e=>e.classList.add('vis'));return}io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.12});$$('.rv:not(.vis)').forEach(e=>io.observe(e))}
function route(){
  const s=decodeURIComponent(location.hash.replace(/^#\/?/,'')),i=POSTS.findIndex(p=>p.slug===s);
  i>=0?post(i):home();
  $$('.links a').forEach(a=>a.classList.toggle('on',(s==='support'&&a.dataset.r==='support')||(s!=='support'&&a.dataset.r==='home')));
  reveal();
  if(s==='support'){const el=$('#support');el&&el.scrollIntoView({behavior:'smooth'})}else window.scrollTo(0,0);
}
addEventListener('hashchange',route);
const nav=$('#nav'),bar=$('#bar');
addEventListener('scroll',()=>{const h=root;nav.classList.toggle('sc',scrollY>20);bar.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
route();
})();
