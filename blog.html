<html lang="en" dir="ltr">
<head>

<meta property="og:title" content="Tradyar Blog">

<title>Tradyar Blog | Trading journaling and risk management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
(function(){try{var t=localStorage.getItem('tradyar:blog-theme')||'system';var r=t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.setAttribute('data-theme',r)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();
</script>
<style>


:root,
[data-theme="light"]{
  --bg:#F5F2EB; --surface:#FAF8F4; --surface-2:#EFEBE3;
  --ink:#3E2C1F; --muted:#7D6B5D;
  --wood:#8B5E3C; --wood-light:#B88A6A;
  --sage:#4A5D4E; --sage-light:#7A907E;
  --gold:#D4A373; --gold-light:#E8C9A6;
  --danger:#C26B5A; --success:#5A8F7B;
  --nav-bg: rgba(245,242,235,.85);
  --border-soft: rgba(255,255,255,.6);
  --shadow-clay: 8px 8px 16px rgba(160,140,120,.25), -8px -8px 16px rgba(255,255,255,.8);
  --shadow-clay-sm: 4px 4px 8px rgba(160,140,120,.2), -4px -4px 8px rgba(255,255,255,.7);
  --shadow-clay-inset: inset 3px 3px 8px rgba(160,140,120,.15), inset -3px -3px 8px rgba(255,255,255,.6);
  color-scheme: light;
}


[data-theme="dark"]{
  --bg:#1E1A16; --surface:#26211C; --surface-2:#2E2822;
  --ink:#F2EAD9; --muted:#B5A692;
  --wood:#B88A6A; --wood-light:#D4A373;
  --sage:#7A907E; --sage-light:#A6B8AA;
  --gold:#E8C9A6; --gold-light:#F0D9B8;
  --danger:#E08C7B; --success:#7BBFA4;
  --nav-bg: rgba(30,26,22,.85);
  --border-soft: rgba(255,255,255,.06);
  --shadow-clay: 8px 8px 16px rgba(0,0,0,.45), -8px -8px 16px rgba(255,255,255,.04);
  --shadow-clay-sm: 4px 4px 8px rgba(0,0,0,.4), -4px -4px 8px rgba(255,255,255,.05);
  --shadow-clay-inset: inset 3px 3px 8px rgba(0,0,0,.4), inset -3px -3px 8px rgba(255,255,255,.05);
  color-scheme: dark;
}


:root{
  --radius-sm:16px; --radius-md:24px; --radius-lg:32px;
  --g:clamp(16px,4vw,48px); --sec:clamp(70px,9vw,120px);
  --out:cubic-bezier(.16,1,.3,1);
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:88px;
  -webkit-text-size-adjust:100%;
  box-sizing:border-box;
  background:var(--bg);
  transition:background-color .35s var(--out);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
section[id],header[id]{scroll-margin-top:88px}

body{
  font-family:'Inter',system-ui,sans-serif;
  line-height:1.8;font-size:.95rem;color:var(--ink);
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,163,115,.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(74,93,78,.10) 0%, transparent 50%);
  overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transition:color .35s var(--out), background-color .35s var(--out);
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(212,163,115,.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(122,144,126,.10) 0%, transparent 50%);
}

a{color:inherit;text-decoration:none}
ul{list-style:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
::selection{background:rgba(212,163,115,.5)}

.d{font-family:'Poppins','Inter',sans-serif;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.n{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1.d{font-size:clamp(2.4rem,7.4vw,6rem);max-width:12ch}
h2.d{font-size:clamp(1.9rem,5vw,3.6rem);max-width:17ch}
.lede{font-size:1.05rem;color:var(--muted);max-width:44ch;margin:24px 0 48px}

.skip{
  position:absolute;top:-40px;left:12px;background:var(--wood);color:#fff;
  padding:8px 16px;border-radius:0 0 12px 12px;z-index:200;font-weight:700;
}
.skip:focus{top:env(safe-area-inset-top,0px)}


.btn{
  display:inline-block;padding:12px 28px;border-radius:50px;
  background:var(--gold);color:var(--ink);
  font:800 .85rem 'Inter',sans-serif;
  border:none;cursor:pointer;
  box-shadow:var(--shadow-clay-sm);
  transition:transform .3s var(--out), box-shadow .3s, background .35s, color .35s;
}
.btn:hover{transform:translateY(-3px);box-shadow:10px 10px 20px rgba(160,140,120,.3), -10px -10px 20px rgba(255,255,255,.9)}
.btn.s{padding:8px 20px;font-size:.78rem;background:var(--surface);color:var(--wood);box-shadow:var(--shadow-clay-sm)}
.btn.s:hover{transform:translateY(-2px);box-shadow:6px 6px 12px rgba(160,140,120,.25), -6px -6px 12px rgba(255,255,255,.8)}


.bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold),var(--wood));z-index:100;border-radius:3px;transition:width .1s linear}


.nav{
  position:fixed;top:0;inset-inline:0;z-index:90;
  display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 16px) var(--g) 16px;
  border-bottom:1px solid transparent;
  transition:padding .35s var(--out),background .35s,border-color .35s;
}
.nav.sc{
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  padding-bottom:8px;
  background:var(--nav-bg);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-color:rgba(160,140,120,.15);
}
.brand{display:flex;align-items:center;gap:10px;font-size:1.4rem;direction:ltr}
.brand i{font-style:normal;background:var(--gold);padding:0 6px;border-radius:6px;color:var(--ink)}
.mark{width:34px;height:34px;border-radius:12px;background:var(--wood);color:var(--gold-light);display:grid;place-items:center;box-shadow:var(--shadow-clay-sm)}
.mark svg{width:19px;height:19px}
.links{display:flex;gap:34px;font-size:.82rem;font-weight:600;color:var(--muted)}
.links a{transition:color .2s}
.links a:hover{color:var(--wood)}


.nav-actions{display:flex;align-items:center;gap:10px}
.theme-toggle{
  position:relative;
  width:64px;height:32px;border-radius:50px;border:none;cursor:pointer;
  background:var(--surface-2);
  box-shadow:var(--shadow-clay-inset);
  transition:background .35s;
  display:inline-flex;align-items:center;padding:0 4px;
}
.theme-toggle::before{
  content:"";
  position:absolute;top:4px;left:4px;
  width:24px;height:24px;border-radius:50%;
  background:var(--gold);
  box-shadow:var(--shadow-clay-sm);
  transition:transform .4s var(--out), background .35s;
  z-index:1;
}
[data-theme="dark"] .theme-toggle::before{
  transform:translateX(32px);
  background:var(--wood);
}
.theme-toggle svg{position:relative;z-index:2;width:14px;height:14px;color:var(--muted);transition:color .3s}
.theme-toggle .sun{margin-left:5px;margin-right:auto}
.theme-toggle .moon{margin-right:5px;margin-left:auto}


.theme-mode{
  display:inline-flex;background:var(--surface-2);border-radius:50px;padding:3px;
  box-shadow:var(--shadow-clay-inset);gap:0;
}
.theme-mode button{
  border:none;background:transparent;cursor:pointer;
  padding:5px 10px;border-radius:50px;
  font:700 .7rem 'Inter',sans-serif;color:var(--muted);
  transition:background .3s,color .3s;
}
.theme-mode button[aria-pressed="true"]{
  background:var(--gold);color:var(--ink);
}


.jl{margin-top:20px}
.ji{display:grid;grid-template-columns:54px 1fr 30px;gap:26px;align-items:center;padding:32px 24px;background:var(--surface);border-radius:var(--radius-md);margin-bottom:16px;box-shadow:var(--shadow-clay-sm);border:1px solid var(--border-soft);transition:transform .3s var(--out), box-shadow .3s, background .35s}
.ji:hover{transform:translateY(-4px);box-shadow:10px 10px 20px rgba(160,140,120,.25), -10px -10px 20px rgba(255,255,255,.8)}
.jnum{font:700 2rem 'Poppins',sans-serif;color:var(--muted)}
.ji small{font-weight:800;font-size:.75rem;background:var(--gold);color:var(--ink);padding:1px 10px;border-radius:6px}
.ji h3{font-size:1.4rem;font-weight:800;line-height:1.5;margin:8px 0 4px;color:var(--ink)}
.ji p{color:var(--muted);font-size:.85rem;max-width:60ch}
.ar2{color:var(--muted);transition:transform .35s var(--out),color .3s}
.ji:hover .ar2{color:var(--wood);transform:translateX(6px)}

.cta{text-align:center;padding:var(--sec) var(--g);margin:var(--sec) var(--g) 0;background:var(--wood);border-radius:var(--radius-lg);box-shadow:var(--shadow-clay);color:#fff;transition:background .35s}
.cta h2{margin:0 auto 16px;color:#fff}
.cta p{color:rgba(255,255,255,.8);margin-bottom:36px}
.cta .btn{background:var(--gold);color:var(--ink);box-shadow:6px 6px 12px rgba(0,0,0,.2), -6px -6px 12px rgba(255,255,255,.1)}

.ft{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px var(--g) calc(30px + env(safe-area-inset-bottom,0px));background:var(--surface-2);color:var(--muted);font-size:.75rem;margin-top:var(--sec);border-radius:var(--radius-md) var(--radius-md) 0 0;transition:background .35s}
.st{display:inline-flex;align-items:center;gap:8px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success);animation:pl 2s infinite}
@keyframes pl{50%{opacity:.4}}

.rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--out),transform .9s var(--out)}
.rv.vis{opacity:1;transform:none}



.nav{--g:clamp(18px,4vw,48px)}
.brand{font-size:1.4rem}
.links a.on{color:var(--wood)}
main{max-width:980px;margin:0 auto;padding:clamp(104px,13vw,140px) var(--g) 0;min-height:70vh}
.hero h1{font-size:clamp(2.3rem,7vw,4.6rem);max-width:14ch;margin-bottom:6px}
.hero .lede{margin:14px 0 30px}
.ch{margin-bottom:22px}
.ji{cursor:pointer}
.ji .mt{display:flex;gap:10px;align-items:center;font-size:.75rem;color:var(--muted)}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-weight:600;font-size:.85rem;margin-bottom:22px}
.back:hover{color:var(--wood)}
.art h1{font-size:clamp(1.9rem,5.4vw,3.4rem);max-width:18ch;margin:10px 0 14px}
.art .meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.8rem;margin-bottom:30px}
.art .meta small{font-weight:800;background:var(--gold);color:var(--ink);padding:1px 10px;border-radius:6px}
.art .meta button{border:none;background:var(--surface-2);color:var(--muted);font:600 .75rem 'Inter',sans-serif;padding:4px 14px;border-radius:50px;cursor:pointer;box-shadow:var(--shadow-clay-sm)}
.body{max-width:42em;font-size:1rem;line-height:2.05}
.body p{margin:0 0 16px}
.body h3{font-size:1.35rem;font-weight:800;margin:34px 0 8px;line-height:1.6}
.body ul{list-style:disc;margin:0 0 18px;padding:0 0 0 22px}
.body li{margin-bottom:6px}
.eg{background:var(--surface);border-radius:var(--radius-md);padding:16px 20px;margin:20px 0;box-shadow:var(--shadow-clay-sm);border-left:4px solid var(--gold);font-size:.95rem}
.eg b{color:var(--wood)}
.body table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.95rem}
.body th,.body td{padding:9px 10px;border-bottom:1px solid rgba(160,140,120,.25);text-align:left}
.body th{color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.next{display:block;margin-top:34px;color:var(--muted);font-size:.8rem}
.next b{display:block;color:var(--ink);font-size:1.1rem;margin-top:2px}
.cta{margin-inline:0}
.sup{margin-top:var(--sec)}
.sup h2{font-size:clamp(1.7rem,4.6vw,2.8rem);margin-bottom:8px}
.sup p{color:var(--muted);max-width:46ch;margin-bottom:24px}
.scs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.sbtn{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border-radius:var(--radius-md);box-shadow:var(--shadow-clay-sm);border:1px solid var(--border-soft);transition:transform .3s var(--out),box-shadow .3s}
.sbtn:hover{transform:translateY(-4px);box-shadow:10px 10px 20px rgba(160,140,120,.25),-10px -10px 20px rgba(255,255,255,.8)}
.sbtn svg{width:42px;height:42px;padding:9px;border-radius:14px;color:#fff;flex:none}
.sbtn.wa svg{background:#3a9d6b}
.sbtn.ig svg{background:linear-gradient(135deg,#8a5cc2,#d4627a,#e8a34f)}
.sbtn b{display:block;font-size:1.05rem}
.sbtn small{color:var(--muted);font-size:.8rem}
.ft a{color:var(--wood);font-weight:700}
@media(max-width:620px){.scs{grid-template-columns:1fr}.nav .btn.s{display:none}}

.skip{top:-90px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{padding:7px 18px;border-radius:50px;border:none;background:var(--surface-2);color:var(--muted);font:600 .8rem 'Inter',sans-serif;cursor:pointer;box-shadow:var(--shadow-clay-sm);transition:all .2s}
.ch button:hover{background:var(--surface);color:var(--wood)}
.ch button[aria-pressed="true"]{background:var(--wood);color:#fff;box-shadow:inset 2px 2px 4px rgba(0,0,0,.1),inset -2px -2px 4px rgba(255,255,255,.1)}
@media(max-width:860px){.ji{grid-template-columns:34px 1fr 22px;gap:14px;padding:24px 16px}.ji h3{font-size:1.15rem}.cta{border-radius:var(--radius-md)}}
@media(max-width:620px){.theme-mode{display:none}.nav{gap:10px}.links{gap:16px}.brand{font-size:1.25rem}.mark{width:30px;height:30px}}


/* Language switch (same look as the theme switch) */
.lang-toggle{position:relative;width:64px;height:32px;border-radius:50px;border:none;cursor:pointer;background:var(--surface-2);box-shadow:var(--shadow-clay-inset);display:inline-flex;align-items:center;padding:0 4px;direction:ltr;font:800 .68rem 'Inter',sans-serif;letter-spacing:.02em;transition:background .35s}
.lang-toggle::before{content:"";position:absolute;top:4px;left:4px;width:26px;height:24px;border-radius:50px;background:var(--gold);box-shadow:var(--shadow-clay-sm);transition:transform .4s var(--out);z-index:1}
html[lang="fa"] .lang-toggle::before{transform:translateX(28px)}
.lang-toggle span{position:relative;z-index:2;flex:1;text-align:center;color:var(--muted);transition:color .3s}
html[lang="en"] .lang-toggle span:first-child,html[lang="fa"] .lang-toggle span:last-child{color:var(--ink)}
html[dir="rtl"] .ar2{transform:scaleX(-1)}
html[dir="rtl"] .ji:hover .ar2{transform:scaleX(-1) translateX(6px)}
/* ===== Persian (RTL) overrides ===== */
html[dir="rtl"] body { font-family: 'Vazirmatn',system-ui,sans-serif; }
html[dir="rtl"] .d { font-family: 'Lalezar','Vazirmatn',sans-serif; font-weight: 400; line-height: 1.25; letter-spacing: initial; }
html[dir="rtl"] h1.d { font-size: clamp(2.7rem,8.6vw,6.8rem); max-width: 11ch; }
html[dir="rtl"] .skip { right: 12px; left: auto; }
html[dir="rtl"] .btn { font: 800 .85rem 'Vazirmatn',sans-serif; }
html[dir="rtl"] .bar { right: 0; left: auto; }
html[dir="rtl"] .theme-toggle::before { right: 4px; left: auto; }
[data-theme="dark"][dir="rtl"] .theme-toggle::before { transform: translateX(-32px); }
html[dir="rtl"] .theme-toggle .sun { margin-right: 5px; margin-left: auto; }
html[dir="rtl"] .theme-toggle .moon { margin-left: 5px; margin-right: auto; }
html[dir="rtl"] .theme-mode button { font: 700 .7rem 'Vazirmatn',sans-serif; }
html[dir="rtl"] .jnum { font: 400 2rem 'Lalezar',sans-serif; }
html[dir="rtl"] .art .meta button { font: 600 .75rem 'Vazirmatn',sans-serif; }
html[dir="rtl"] .body ul { padding: 0 22px 0 0; }
html[dir="rtl"] .eg { border-right: 4px solid var(--gold); border-left: none; }
html[dir="rtl"] .body th, html[dir="rtl"] .body td { text-align: right; }
html[dir="rtl"] .ch button { font: 600 .8rem 'Vazirmatn',sans-serif; }

/* ===== Header: big wordmark, language + theme switches, kebab menu on phones ===== */
.nav .btn.s{display:inline-block;padding:9px 20px;font-size:.78rem}
.links{gap:22px;font-size:.84rem}
.kebab-wrap{position:relative;display:none}
.kebab{width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);box-shadow:var(--shadow-clay-sm);color:var(--wood);display:grid;place-items:center;cursor:pointer}
.kebab svg{width:20px;height:20px}
.menu{display:none;position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:176px;padding:6px;border-radius:18px;background:var(--surface-2);box-shadow:0 14px 34px rgba(0,0,0,.2),var(--shadow-clay-sm);z-index:130}
.menu.open{display:block}
.menu a{display:block;padding:11px 16px;border-radius:12px;font-weight:700;font-size:.9rem;color:inherit}
.menu a:hover,.menu a:focus-visible{background:var(--gold);color:var(--ink)}
html[dir="rtl"] .menu a{font-family:'Vazirmatn',sans-serif}
@media(max-width:620px){
  .nav{--g:16px;flex-wrap:nowrap;gap:8px;align-items:center}
  .mark{display:none}
  .brand{font-size:1.75rem}
  .links,.nav .btn.s{display:none}
  .kebab-wrap{display:block}
  .nav-actions{gap:8px}
  .theme-toggle,.lang-toggle{width:52px;height:30px}
  .theme-toggle::before{width:22px;height:22px;top:4px}
  [data-theme="dark"] .theme-toggle::before{transform:translateX(22px)}
  [data-theme="dark"][dir="rtl"] .theme-toggle::before{transform:translateX(-22px)}
  .theme-toggle svg{width:13px;height:13px}
  .lang-toggle{font-size:.64rem}
  .lang-toggle::before{width:24px;height:22px;top:4px}
  html[lang="fa"] .lang-toggle::before{transform:translateX(20px)}
}
</style>
</head>

{slug:'why-journal',cat:'Journaling',date:'Nov 2026',min:4,title:'Why you can\'t become a trader without a journal',sum:'Memory fools you. A journal is the only way to see your real patterns.',
body:`<p>Most traders think they know how they trade. Then they see the real numbers, and it turns out to be something else. Memory keeps big wins vivid and repeated losses faint.</p>
<h3>What does a journal show you?</h3>
<ul><li>Which symbol, session and strategy actually make you money, and which only feel good.</li><li>What state usually comes before your biggest losses: revenge, rushing, fatigue or FOMO.</li><li>Whether you follow your plan, or only think you do.</li></ul>
<div class="eg"><b>Example:</b> A trader believed gold was their strongest symbol. After logging 60 trades, they saw that 70% of their losses came from the Asian session on gold. Dropping that one session changed their month.</div>
<h3>What should you log?</h3>
<p>Less than you think: symbol, direction, entry, stop, exit, size, risk percent, strategy and one sentence about your state of mind. A journal that is hard to fill in gets abandoned after two weeks.</p>
<h3>When should you review?</h3>
<p>Once a week, for ten minutes. Instead of replaying every trade, ask three questions: What was my best pattern this week? What was my most repeated mistake? How do I change just one thing next week?</p>`},

{slug:'r-multiple',cat:'Risk management',date:'Nov 2026',min:5,title:'What is R, and why does it matter more than dollar profit?',sum:'A $200 gain on a $1,000 account is not the same as a $200 gain on a $10,000 account. R solves this.',
body:`<p>R is a unit that measures profit and loss in terms of the risk taken on that trade, instead of dollars. If you risked $100 on a trade, that $100 becomes "1R".</p>
<div class="eg"><b>Example:</b> Risk <span class="num">$100</span>. A profit of <span class="num">$250</span> is <span class="num">+2.5R</span>. A full loss is <span class="num">-1R</span>.</div>
<h3>Why is R better than dollars?</h3>
<p>Because it makes trades with different risk sizes comparable. A trade that made <span class="num">+3R</span> with small risk was executed better than one that made <span class="num">+0.5R</span> with large risk, even if the second one made more dollars.</p>
<h3>Expectancy</h3>
<p>The average R per trade over the long run. The formula is simple:</p>
<div class="eg num" style="direction:ltr;text-align:left">Expectancy = (Win% × Avg Win R) − (Loss% × Avg Loss R)</div>
<p>If 40% of trades win with an average of <span class="num">2R</span> and 60% lose with an average of <span class="num">1R</span>: <span class="num">0.4×2 − 0.6×1 = +0.2R</span> per trade. You can be profitable even with a 40% win rate.</p>
<p>In Tradyar, each trade's R is calculated from the risk percent logged on that trade, not from a fixed number.</p>`},

{slug:'position-size',cat:'Risk management',date:'Nov 2026',min:5,title:'How to calculate position size: formula and example',sum:'Decide your dollar risk first, then work out the size from the stop distance; not the other way around.',
body:`<p>A common mistake is to pick the lot size first and then place the stop wherever it "fits". The right way is the opposite: fix the risk, and adjust the size to the stop distance.</p>
<h3>Three steps</h3>
<ul><li>Dollar risk = balance × risk percent</li><li>Write the stop distance in pips (or points).</li><li>Size = dollar risk ÷ (stop distance × value of one pip per lot)</li></ul>
<div class="eg"><b>EURUSD example:</b> Balance <span class="num">$10,000</span>, 1% risk means <span class="num">$100</span>. The stop is <span class="num">50</span> pips and one pip is worth <span class="num">$10</span> per lot.<br>Size = <span class="num">100 ÷ (50 × 10) = 0.20</span> lots.</div>
<h3>Pairs without the dollar</h3>
<p>In pairs like GBPJPY or CADNZD, profit is paid in the second currency, and converting it to dollars needs that currency's rate. That is why the pip value changes with the live price. For these pairs, Tradyar asks you for the conversion rate so the number is exact.</p>
<p>Reminder: contract size and pip value for gold, indices and crypto differ between brokers; compare any calculator with your own platform before relying on it.</p>`},

{slug:'prop-drawdown',cat:'Prop firms',date:'Nov 2026',min:5,title:'Drawdown in prop firms: why most challenges fail here',sum:'Daily loss, total drawdown, and static vs trailing: read this before buying a challenge.',
body:`<p>Most people who fail a prop challenge don't fail because of a bad strategy; they fail because they break a drawdown rule. Every firm's rules differ and may change, so always read that firm's official text. The concepts, though, are shared.</p>
<h3>Three rules you must know exactly</h3>
<ul><li><b>Maximum daily loss:</b> the loss limit within a single day. Ask: is it based on the start-of-day balance, or on equity (including open trades)?</li><li><b>Maximum total drawdown:</b> the allowed drop from the initial capital.</li><li><b>Static or trailing:</b> in trailing mode, the drawdown limit rises as your equity rises, and your safety margin shrinks.</li></ul>
<h3>Why losses are heavier than you think</h3>
<table><tr><th>Loss</th><th>Gain needed to recover</th></tr><tr><td class="num">10%</td><td class="num">11.1%</td></tr><tr><td class="num">20%</td><td class="num">25%</td></tr><tr><td class="num">50%</td><td class="num">100%</td></tr></table>
<p>So the most practical defense is risking less than the limits; for example, if the allowed daily loss is 5%, set your personal limit at 2–3% so one bad day can't take your account.</p>
<p>In Tradyar, you can enter the prop rules for each account and get alerts when you reach 50%, 75% and 90% of the limit.</p>`},
{slug:'emotions',cat:'Psychology',date:'Nov 2026',min:4,title:'How to log fear and greed in your journal',sum:'You can\'t remove emotion, but you can see where and how often it changes your decisions.',
body:`<p>Most trading mistakes don't come from bad analysis; they come from the moment your state of mind gets ahead of your plan. What isn't logged isn't seen, and what isn't seen gets repeated.</p>
<h3>Three states worth logging</h3>
<ul><li><b>Fear:</b> closing a healthy trade early, or not moving your stop because of worry.</li><li><b>Greed:</b> increasing size after a few wins, or not closing at the target.</li><li><b>Revenge:</b> an immediate trade after a loss to win it back.</li></ul>
<h3>How to log it</h3>
<p>After each trade, add just one tag: what state was I in, and was I following the plan? After 20–30 trades, compare the stats: your average R when you were calm versus when you were rushing.</p>
<div class="eg"><b>A common result:</b> trades tagged "revenge" usually have the worst R. When the number is in front of you, deciding "no more today" gets easier.</div>
<p>In Tradyar, you can log the emotion, execution quality and plan adherence for each trade, and see stats based on them later.</p>`}
];

{slug:'why-journal',cat:'ژورنال‌نویسی',date:'آبان ۱۴۰۵',min:4,title:'چرا بدون ژورنال، معامله‌گر نمی‌شوی؟',sum:'حافظه تو را گول می‌زند. ژورنال یگانه راه دیدن الگوهای واقعی خودت است.',
body:`<p>بیشتر معامله‌گرها فکر می‌کنند می‌دانند چطور معامله می‌کنند. وقتی آمار واقعی را می‌بینند، چیز دیگری درمی‌آید. حافظه سودهای بزرگ را پررنگ و ضررهای تکراری را کم‌رنگ نگه می‌دارد.</p>
<h3>ژورنال چه چیزهایی را نشان می‌دهد؟</h3>
<ul><li>کدام نماد، سشن و استراتژی واقعاً برایت سود می‌سازد و کدام فقط حس خوبی می‌دهد.</li><li>بیشترین ضررها بعد از چه حالتی می‌آید: انتقام، عجله، خستگی یا FOMO.</li><li>آیا به پلن خودت پایبندی یا فقط فکر می‌کنی پایبندی.</li></ul>
<div class="eg"><b>مثال:</b> معامله‌گری فکر می‌کرد طلا نمادِ قوی‌اش است. بعد از ثبت ۶۰ معامله دید ۷۰٪ ضررهایش در سشن آسیا و روی طلا است. حذف همان سشن، نتیجه‌ی ماهش را عوض کرد.</div>
<h3>چه چیزی ثبت کنیم؟</h3>
<p>کمتر از آنچه فکر می‌کنی: نماد، جهت، ورود، استاپ، خروج، حجم، ریسک درصدی، استراتژی و یک جمله درباره‌ی حالت ذهنی‌ات. ژورنالی که ثبتش سخت باشد، بعد از دو هفته رها می‌شود.</p>
<h3>چه زمانی مرور کنیم؟</h3>
<p>یک بار در هفته، ده دقیقه. به جای تماشای تک‌تک معاملات، سه سؤال بپرس: بهترین الگوی این هفته چه بود؟ تکراری‌ترین اشتباه کدام بود؟ هفته‌ی بعد فقط یک چیز را چطور عوض کنم؟</p>`},

{slug:'r-multiple',cat:'مدیریت ریسک',date:'آبان ۱۴۰۵',min:5,title:'R چیست و چرا از سود دلاری مهم‌تر است؟',sum:'سود ۲۰۰ دلاری روی حساب ۱۰۰۰ دلاری با سود ۲۰۰ دلاری روی حساب ۱۰٬۰۰۰ دلاری یکی نیست. R این را حل می‌کند.',
body:`<p>R واحدی است که سود و زیان را به‌جای دلار، بر حسب ریسک همان معامله می‌سنجد. اگر در یک معامله ۱۰۰ دلار ریسک کرده‌ای، آن ۱۰۰ دلار می‌شود «۱R».</p>
<div class="eg"><b>مثال:</b> ریسک <span class="num">$100</span>. سود <span class="num">$250</span> یعنی <span class="num">+2.5R</span>. ضرر کامل یعنی <span class="num">-1R</span>.</div>
<h3>چرا R بهتر از دلار است؟</h3>
<p>چون معاملات با ریسک‌های مختلف را قابل مقایسه می‌کند. معامله‌ای که با ریسک کم <span class="num">+3R</span> شده، از معامله‌ای که با ریسک زیاد <span class="num">+0.5R</span> شده بهتر اجرا شده؛ حتی اگر سود دلاری دومی بیشتر باشد.</p>
<h3>امید ریاضی (Expectancy)</h3>
<p>میانگین R هر معامله در بلندمدت. فرمولش ساده است:</p>
<div class="eg num" style="direction:ltr;text-align:left">Expectancy = (Win% × Avg Win R) − (Loss% × Avg Loss R)</div>
<p>اگر ۴۰٪ معاملات برنده با میانگین <span class="num">2R</span> و ۶۰٪ بازنده با میانگین <span class="num">1R</span> باشد: <span class="num">0.4×2 − 0.6×1 = +0.2R</span> برای هر معامله. با وین‌ریت ۴۰٪ هم می‌شود سودده بود.</p>
<p>در Tradyar، R هر معامله بر اساس ریسک درصدی ثبت‌شده‌ی همان معامله حساب می‌شود، نه یک عدد ثابت.</p>`},

{slug:'position-size',cat:'مدیریت ریسک',date:'آبان ۱۴۰۵',min:5,title:'حجم معامله را چطور حساب کنیم؟ فرمول و مثال',sum:'اول ریسک دلاری را مشخص کن، بعد از روی فاصله‌ی استاپ، حجم را درآور؛ نه برعکس.',
body:`<p>اشتباه رایج این است که اول لات انتخاب می‌شود و بعد استاپ جایی گذاشته می‌شود که «جا بشود». روش درست برعکس است: ریسک را ثابت کن و حجم را با فاصله‌ی استاپ تنظیم کن.</p>
<h3>سه مرحله</h3>
<ul><li>ریسک دلاری = موجودی × درصد ریسک</li><li>فاصله‌ی استاپ را به پیپ (یا پوینت) بنویس.</li><li>حجم = ریسک دلاری ÷ (فاصله‌ی استاپ × ارزش هر پیپ برای یک لات)</li></ul>
<div class="eg"><b>مثال EURUSD:</b> موجودی <span class="num">$10,000</span>، ریسک ۱٪ یعنی <span class="num">$100</span>. استاپ <span class="num">50</span> پیپ و ارزش هر پیپ برای یک لات <span class="num">$10</span> است.<br>حجم = <span class="num">100 ÷ (50 × 10) = 0.20</span> لات.</div>
<h3>جفت‌ارزهایی که دلار ندارند</h3>
<p>در جفت‌هایی مثل GBPJPY یا CADNZD سود به ارز دوم می‌آید و برای تبدیل به دلار نرخ آن ارز لازم است. برای همین ارزش پیپ با قیمت لحظه‌ای عوض می‌شود. Tradyar برای این جفت‌ها از تو نرخ تبدیل را می‌خواهد تا عدد دقیق شود.</p>
<p>یادآوری: اندازه‌ی قرارداد و ارزش پیپ در طلا، شاخص‌ها و کریپتو بین بروکرها فرق دارد؛ قبل از اتکا به هر محاسبه‌گر، یک بار با پلتفرم خودت مقایسه‌اش کن.</p>`},

{slug:'prop-drawdown',cat:'پراپ‌فرم',date:'آبان ۱۴۰۵',min:5,title:'دراودان در پراپ‌فرم: چرا بیشتر چالش‌ها همین‌جا می‌سوزند؟',sum:'ضرر روزانه، دراودان کل و تفاوت ثابت با تریلینگ: پیش از خرید چالش بخوان.',
body:`<p>بیشتر کسانی که چالش پراپ را می‌بازند، به‌خاطر استراتژی بد نمی‌بازند؛ به‌خاطر نقض یک قانون دراودان می‌بازند. قوانین هر شرکت فرق دارد و ممکن است عوض شود، پس همیشه متن رسمی همان شرکت را بخوان. اما مفهوم‌ها مشترک‌اند.</p>
<h3>سه قانونی که باید دقیق بدانی</h3>
<ul><li><b>حداکثر ضرر روزانه:</b> سقف زیانی که در یک روز مجازی. بپرس: بر اساس موجودی ابتدای روز حساب می‌شود یا اکوییتی (شامل معاملات باز)؟</li><li><b>حداکثر دراودان کل:</b> افت مجاز از سرمایه‌ی اولیه.</li><li><b>ثابت یا تریلینگ:</b> در حالت تریلینگ، سقف دراودان با بالا رفتن اکوییتی بالا می‌آید و حاشیه‌ی امنت کم می‌شود.</li></ul>
<h3>چرا ضررها سنگین‌تر از چیزی‌اند که فکر می‌کنی</h3>
<table><tr><th>ضرر</th><th>سود لازم برای جبران</th></tr><tr><td class="num">10%</td><td class="num">11.1%</td></tr><tr><td class="num">20%</td><td class="num">25%</td></tr><tr><td class="num">50%</td><td class="num">100%</td></tr></table>
<p>پس عملی‌ترین دفاع، ریسک کوچک‌تر از سقف‌هاست؛ مثلاً اگر ضرر روزانه‌ی مجاز ۵٪ است، سقف شخصی‌ات را ۲ تا ۳٪ بگذار تا یک روز بد حسابت را نبرد.</p>
<p>در Tradyar برای هر حساب می‌توانی قوانین پراپ را بنویسی و وقتی به ۵۰٪، ۷۵٪ و ۹۰٪ سقف رسیدی هشدار بگیری.</p>`},
{slug:'emotions',cat:'روان‌شناسی',date:'آبان ۱۴۰۵',min:4,title:'ترس و طمع را چطور در ژورنال ثبت کنیم؟',sum:'احساس را نمی‌شود حذف کرد، ولی می‌شود دید کجا و چند بار تصمیم‌هایت را عوض می‌کند.',
body:`<p>بیشتر اشتباه‌های معاملاتی از تحلیل بد نمی‌آیند؛ از لحظه‌ای می‌آیند که حالت ذهنی‌ات از پلن جلو می‌زند. چیزی که ثبت نشود، دیده نمی‌شود و چیزی که دیده نشود، تکرار می‌شود.</p>
<h3>سه حالت که ارزش ثبت دارند</h3>
<ul><li><b>ترس:</b> زود بستن معامله‌ی سالم، یا جابه‌جا نکردن استاپ به‌خاطر نگرانی.</li><li><b>طمع:</b> بزرگ کردن حجم بعد از چند برد، یا نبستن در تارگت.</li><li><b>انتقام:</b> معامله‌ی فوری بعد از ضرر برای جبران.</li></ul>
<h3>چطور ثبت کنیم؟</h3>
<p>بعد از هر معامله فقط یک برچسب بزن: چه حالتی داشتم و آیا طبق پلن بودم؟ بعد از ۲۰ تا ۳۰ معامله، آمار را مقایسه کن: میانگین R وقتی آرام بوده‌ای در برابر وقتی عجله داشته‌ای.</p>
<div class="eg"><b>نتیجه‌ی رایج:</b> معامله‌هایی که با «انتقام» ثبت می‌شوند معمولاً بدترین R را دارند. وقتی عدد جلوی چشمت باشد، تصمیم «امروز دیگر نه» راحت‌تر می‌شود.</div>
<p>در Tradyar برای هر معامله می‌توانی احساس، کیفیت اجرا و رعایت پلن را ثبت کنی و بعداً بر اساس آن‌ها آمار ببینی.</p>`}
];

 support:`<section class="sup rv" id="support"><h2 class="d">Support</h2><p>Have a question, a payment problem or a suggestion? Message us directly; we usually reply the same day.</p><div class="scs"><a class="sbtn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${ICON_WA}<div><b>WhatsApp</b><small class="n">+98 902 187 9076</small></div></a><a class="sbtn ig" href="https://instagram.com/${IG}" target="_blank" rel="noopener">${ICON_IG}<div><b>Instagram</b><small class="n">@${IG}</small></div></a></div></section>`,cta:`<section class="cta rv"><h2 class="d">Log your first trade right now</h2><p>It takes ten seconds, the first seven days are free, and from day one your journal starts learning from you.</p><a href="./" class="btn">Start free</a></section>`,
 item:(p,i)=>`<a href="#/${p.slug}" class="ji rv"><span class="jnum">${fa(i+1)}</span><div><small>${p.cat}</small><h3>${p.title}</h3><p>${p.sum}</p><div class="mt"><span>${p.date}</span><span>${fa(p.min)} min read</span></div></div>${ARROW}</a>`,
 home:()=>`<header class="hero"><h1 class="d">From the trading world</h1><p class="lede">Short, practical articles on journaling, R, position size, psychology and prop firm rules.</p><div class="ch" role="group" aria-label="Categories">${CATS.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div></header><div class="jl" id="jl">${listHTML()}</div>${ctaHTML}${supportHTML}`,
 post:(p,n)=>`<article class="art"><a class="back" href="#/">← All articles</a><div class="meta"><small>${p.cat}</small><span>${p.date}</span><span>${fa(p.min)} min read</span><button id="cp" type="button">Copy link</button></div><h1 class="d">${p.title}</h1><div class="body">${p.body}</div><a class="next" href="#/${n.slug}">Next article<b>${n.title}</b></a></article>${ctaHTML}${supportHTML}`},
fa:{dir:'rtl',num:'fa',all:'همه',homeTitle:'وبلاگ Tradyar | آموزش ژورنال‌نویسی و مدیریت ریسک',copied:'کپی شد',copyfail:'لینک را از نوار آدرس بردار',posts:POSTS_FA,st:{"skip": "پرش به محتوا", "nav": "ناوبری اصلی", "brand": "وبلاگ Tradyar", "articles": "مقاله‌ها", "support": "پشتیبانی", "toggleTheme": "تغییر تم", "open": "ورود به ژورنال", "foot": "© ۱۴۰۵ Tradyar · مطالب آموزشی است و مشاوره‌ی مالی یا سیگنال نیست", "langAria": "زبان", "login": "ورود", "signup": "ثبت نام", "menu": "منو"},
 support:`<section class="sup rv" id="support"><h2 class="d">پشتیبانی</h2><p>سؤال، مشکل پرداخت یا پیشنهاد داری؟ مستقیم پیام بده؛ معمولاً همان روز جواب می‌دهیم.</p><div class="scs"><a class="sbtn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${ICON_WA}<div><b>واتساپ</b><small class="n">+98 902 187 9076</small></div></a><a class="sbtn ig" href="https://instagram.com/${IG}" target="_blank" rel="noopener">${ICON_IG}<div><b>اینستاگرام</b><small class="n">@${IG}</small></div></a></div></section>`,cta:`<section class="cta rv"><h2 class="d">اولین معامله‌ات را همین حالا ثبت کن</h2><p>ده ثانیه وقت می‌گیرد، هفت روز اول رایگان است و از همان روز ژورنالت از تو یاد می‌گیرد.</p><a href="./" class="btn">شروع رایگان</a></section>`,
 item:(p,i)=>`<a href="#/${p.slug}" class="ji rv"><span class="jnum">${fa(i+1)}</span><div><small>${p.cat}</small><h3>${p.title}</h3><p>${p.sum}</p><div class="mt"><span>${p.date}</span><span>${fa(p.min)} دقیقه مطالعه</span></div></div>${ARROW}</a>`,
 home:()=>`<header class="hero"><h1 class="d">از دنیای معامله‌گری</h1><p class="lede">مقاله‌های کوتاه و عملی درباره‌ی ژورنال، R، حجم معامله، روان‌شناسی و قوانین پراپ‌فرم.</p><div class="ch" role="group" aria-label="دسته‌بندی">${CATS.map(c=>`<button type="button" data-cat="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div></header><div class="jl" id="jl">${listHTML()}</div>${ctaHTML}${supportHTML}`,
 post:(p,n)=>`<article class="art"><a class="back" href="#/">→ همه‌ی مقاله‌ها</a><div class="meta"><small>${p.cat}</small><span>${p.date}</span><span>${fa(p.min)} دقیقه مطالعه</span><button id="cp" type="button">کپی لینک</button></div><h1 class="d">${p.title}</h1><div class="body">${p.body}</div><a class="next" href="#/${n.slug}">مقاله‌ی بعدی<b>${n.title}</b></a></article>${ctaHTML}${supportHTML}`}};
/* Theme */
const KEY='tradyar:blog-theme',mq=matchMedia('(prefers-color-scheme: dark)');let mode='system';try{mode=localStorage.getItem(KEY)||'system'}catch(e){}
function applyTheme(m){const t=m==='system'?(mq.matches?'dark':'light'):m;root.setAttribute('data-theme',t);$$('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeSet===m));const mc=$('meta[name="theme-color"]');if(mc)mc.setAttribute('content',t==='dark'?'#1E1A16':'#F5F2EB')}
function setTheme(m){mode=m;try{localStorage.setItem(KEY,m)}catch(e){}applyTheme(m)}
applyTheme(mode);
$$('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.themeSet)));
$('#themeToggle').addEventListener('click',()=>setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark'));
mq.addEventListener('change',()=>{if(mode==='system')applyTheme('system')});
/* Shared sections */
let supportHTML='',ctaHTML='',POSTS=POSTS_EN,CATS=[],cat='',L=I18N.en;
function listHTML(){return POSTS.map((p,i)=>({p,i})).filter(x=>cat===L.all||x.p.cat===cat).map(({p,i})=>L.item(p,i)).join('')}
function home(){
  document.title=L.homeTitle;
  app.innerHTML=L.home();
  $$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.cat;$$('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===cat));$('#jl').innerHTML=listHTML();reveal()}));
}
function post(i){
  const p=POSTS[i],n=POSTS[(i+1)%POSTS.length];
  document.title=p.title+' | Tradyar';
  app.innerHTML=L.post(p,n);
  $('#cp').onclick=e=>{const b=e.target,old=b.textContent;(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(()=>b.textContent=L.copied,()=>b.textContent=L.copyfail);setTimeout(()=>b.textContent=old,2200)};
}
let io;
function reveal(){if(!('IntersectionObserver' in window)){$$('.rv').forEach(e=>e.classList.add('vis'));return}io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('vis');io.unobserve(e.target)}}),{threshold:.12});$$('.rv:not(.vis)').forEach(e=>io.observe(e))}
function route(){
  const s=decodeURIComponent(location.hash.replace(/^#\/?/,'')),i=POSTS.findIndex(p=>p.slug===s);
  i>=0?post(i):home();
  $$('.links a').forEach(a=>a.classList.toggle('on',(s==='support'&&a.dataset.r==='support')||(s!=='support'&&a.dataset.r==='home')));
  reveal();
  if(s==='support'){const el=$('#support');el&&el.scrollIntoView({behavior:'smooth'})}else window.scrollTo(0,0);
}
addEventListener('hashchange',route);
const nav=$('#nav'),bar=$('#bar');
addEventListener('scroll',()=>{const h=root;nav.classList.toggle('sc',scrollY>20);bar.style.width=(h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});
/* Language (shares the "tradyar-lang" key with the main app) */
const LKEY='tradyar-lang';let lang='en';try{lang=localStorage.getItem(LKEY)==='fa'?'fa':'en'}catch(e){}
let fontsOn=false;function addFonts(){if(fontsOn)return;fontsOn=true;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;600;800&display=swap';document.head.appendChild(l)}
function applyLang(l){
  lang=l;L=I18N[l];POSTS=L.posts;fa=n=>Number(n).toLocaleString(L.num);
  root.lang=l;root.dir=L.dir;supportHTML=L.support;ctaHTML=L.cta;
  CATS=[L.all,...new Set(POSTS.map(p=>p.cat))];cat=L.all;
  $$('[data-t]').forEach(e=>{e.textContent=L.st[e.dataset.t]});
  $$('[data-tl]').forEach(e=>e.setAttribute('aria-label',L.st[e.dataset.tl]));
  if(l==='fa')addFonts();
}
function setLang(l){lang=l;try{localStorage.setItem(LKEY,l)}catch(e){}applyLang(l);route()}
$('#langToggle').addEventListener('click',()=>setLang(lang==='fa'?'en':'fa'));
applyLang(lang);
const kb=$('#kebab'),mn=$('#menu');
kb.addEventListener('click',e=>{e.stopPropagation();const o=mn.classList.toggle('open');kb.setAttribute('aria-expanded',o?'true':'false')});
addEventListener('click',()=>{mn.classList.remove('open');kb.setAttribute('aria-expanded','false')});
addEventListener('keydown',e=>{if(e.key==='Escape'){mn.classList.remove('open');kb.setAttribute('aria-expanded','false')}});
route();
})();
</script>
</body>
</html>
